name: Backend CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "prisma/**"
      - "test/**"
      - "data/recipes.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [backend]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bereket_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bereket_ai_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/bereket_ai_test
      JWT_ACCESS_SECRET: ci-jwt-secret-at-least-32-characters-long
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-at-least-32-characters
      PASSWORD_RESET_TOKEN_PEPPER: ci-reset-pepper-at-least-32-characters
      RUN_DATABASE_TESTS: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm db:deploy
      - run: pnpm db:import
      - run: pnpm db:import
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --prod
