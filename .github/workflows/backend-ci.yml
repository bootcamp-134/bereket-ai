name: Backend CI

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "prisma/**"
      - "test/**"
      - "data/recipes.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [backend]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bereket_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bereket_ai_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/bereket_ai_test
      JWT_ACCESS_SECRET: ci-jwt-secret-at-least-32-characters-long
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-at-least-32-characters
      PASSWORD_RESET_TOKEN_PEPPER: ci-reset-pepper-at-least-32-characters
      OPENAI_SAFETY_PEPPER: ci-openai-safety-pepper-at-least-32-chars
      CRON_SECRET: ci-cron-secret-at-least-32-characters-long
      RUN_DATABASE_TESTS: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm db:deploy
      - run: pnpm db:import
      - run: pnpm db:import
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --prod
